[package]
name = "opto-sync-desktop-app"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
description = "Native Rust desktop app for Opto Sync"
repository = "https://github.com/opto-sync/opto-sync-desktop-app.rs"
default-run = "opto-sync-desktop"

[lib]
name = "opto_sync_desktop_core"
path = "src/lib.rs"

[[bin]]
name = "opto-sync-desktop"
path = "src/main.rs"

[dependencies]
opto-sync-desktop-fenced-lifecycle = { package = "opto-sync-desktop-lifecycle", git = "https://github.com/opto-sync/opto-sync-clients", rev = "5c1cbcf0f8f3cccc8f771ad690db5c9b7f1bcded" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
enum_glob_use = "deny"
match_wildcard_for_single_variants = "deny"
wildcard_enum_match_arm = "deny"
